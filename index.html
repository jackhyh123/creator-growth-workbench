<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>达人增长工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#1f2937;padding:24px}
.app{max-width:1100px;margin:0 auto}
a{color:inherit;text-decoration:none}
.hd{margin-bottom:20px} .hd h1{font-size:22px;font-weight:700}
.hd .sub{font-size:13px;color:#6b7280;margin-top:4px}
.summary{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sbox{flex:1;min-width:95px;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sbox .n{font-size:22px;font-weight:700} .sbox .l{font-size:12px;color:#6b7280}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:10px;background:#fff;font-size:14px;cursor:pointer;border:1px solid transparent}
.tab.active{background:#111827;color:#fff}
.panel{display:none} .panel.active{display:block}
.group{margin-bottom:18px}
.group-label{font-size:14px;font-weight:600;margin-bottom:8px}
.task{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.cb{width:18px;height:18px} .task-body{flex:1}
.task-who{font-weight:600;font-size:14px} .task-what{font-size:13px;margin-top:2px}
.task-why{font-size:12px;color:#9ca3af;margin-top:2px}
.task-due{font-size:12px;color:#ef4444;font-weight:600;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.ownerbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.obtn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;border:1px solid #2a3140;background:#161a21;color:#c9d1d9;font-size:13px;cursor:pointer}
.obtn.on{background:#e5e7eb;color:#111827;border-color:#e5e7eb;font-weight:700}
.ocnt{font-size:11px;opacity:.65}
body.light .obtn{background:#fff;border-color:#e5e7eb;color:#374151}
body.light .obtn.on{background:#111827;color:#fff;border-color:#111827}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.badge.green{background:#dcfce7;color:#166534} .badge.amber{background:#fef3c7;color:#92400e}
.badge.red{background:#fee2e2;color:#991b1b} .badge.gray{background:#f3f4f6;color:#4b5563}
.badge.blue{background:#dbeafe;color:#1e40af} .badge.purple{background:#ede9fe;color:#5b21b6}
.coop{font-size:10px;padding:2px 6px;border-radius:20px;font-weight:600;white-space:nowrap}
.coop-green{background:#ecfdf5;color:#047857} .coop-amber{background:#fffbeb;color:#b45309} .coop-red{background:#fef2f2;color:#b91c1c}
.roas{font-size:12px;color:#6b7280;white-space:nowrap}
.card-name{font-size:15px;font-weight:600;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-stats{display:flex;gap:8px;font-size:12px;color:#6b7280;margin-bottom:6px}
.card-pkg{font-size:12px;color:#4b5563;background:#f9fafb;padding:4px 8px;border-radius:6px;margin-bottom:6px}
.card-action{font-size:12px;color:#2563eb;background:#eff6ff;padding:5px 8px;border-radius:6px}
.pkgrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pkg-creator{font-weight:600;font-size:14px;min-width:130px}
.pkg-id{font-size:12px;color:#9ca3af;min-width:110px}
.pkg-action{flex:1;font-size:13px;color:#1f2937}
.pkg-block{font-size:12px;color:#ef4444}
.dec{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);border-left:3px solid #ef4444}
.dec-who{font-weight:600;font-size:14px;min-width:120px} .dec-what{flex:1;font-size:13px}
.dec-why{font-size:12px;color:#9ca3af}
.btn{background:#111827;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.foot{margin-top:24px;font-size:12px;color:#9ca3af;text-align:center}
/* 达人详情页 */
.back{display:inline-block;margin-bottom:16px;font-size:13px;color:#2563eb;cursor:pointer}
.detail-hd{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.detail-hd h2{font-size:22px}
.detail-hd .email{font-size:13px;color:#6b7280}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kpi .k{font-size:12px;color:#6b7280} .kpi .v{font-size:20px;font-weight:700;margin-top:4px}
.block{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.block h3{font-size:15px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #f3f4f6}
th{color:#6b7280;font-weight:500;font-size:12px}
tr:last-child td{border-bottom:none}
.tl{list-style:none;font-size:13px} .tl li{padding:6px 0;border-left:2px solid #e5e7eb;padding-left:12px;margin-left:4px} .tl .d{font-size:12px;color:#9ca3af;margin-right:6px}

.fstats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#374151}
.fstats b{color:#111827;font-weight:700}
body.dark .fstats{color:#d1d5db}
body.dark .fstats b{color:#fff}
.src{font-size:11px;color:#6b7280;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:300;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:20px;width:440px;max-width:100%;max-height:90vh;overflow:auto}
.modal-box h3{font-size:16px;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:12px;color:#6b7280;display:flex;flex-direction:column;gap:4px}
.form input,.form select{padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;background:#fff;color:#1f2937}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn2{background:#f3f4f6;color:#374151;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer}
body.dark .modal-box{background:#1a1d24}
body.dark .form label{color:#9ca3af}
body.dark .form input,body.dark .form select{background:#23272f;border-color:#2a2f38;color:#e5e7eb}
body.dark .btn2{background:#23272f;color:#d1d5db}
/* ===== 黑夜模式 ===== */
.theme-ctrl{position:fixed;top:16px;right:16px;z-index:200;display:flex;gap:8px;align-items:center}
.theme-toggle{background:#fff;color:#1f2937;border:1px solid #e5e7eb;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:all .15s}
.theme-toggle:hover{transform:translateY(-1px)}
body.dark{background:#0f1115;color:#e5e7eb}
body.dark .sbox,body.dark .tab,body.dark .task,body.dark .card,body.dark .pkgrow,body.dark .dec,body.dark .block,body.dark .kpi{background:#1a1d24;box-shadow:0 1px 3px rgba(0,0,0,.4)}
body.dark .tab.active{background:#e5e7eb;color:#111827}
body.dark .card-pkg{background:#23272f;color:#d1d5db}
body.dark .card-action{background:#1e293b;color:#93c5fd}
body.dark .card:hover{box-shadow:0 6px 16px rgba(0,0,0,.5)}
body.dark .btn{background:#e5e7eb;color:#111827}
body.dark th{color:#9ca3af}
body.dark th,body.dark td{border-bottom-color:#2a2f38}
body.dark .tl li{border-left-color:#2a2f38}
body.dark .hd .sub,body.dark .email,body.dark .roas,body.dark .sbox .l,body.dark .kpi .k,body.dark .dec-why,body.dark .task-why,body.dark .card-stats,body.dark .foot{color:#9ca3af}
body.dark .card-name,body.dark .task-who,body.dark .dec-who,body.dark .block h3,body.dark .hd h1,body.dark .detail-hd h2{color:#e5e7eb}
body.dark .back{color:#60a5fa}
body.dark .badge.green{background:rgba(34,197,94,.18);color:#86efac}
body.dark .badge.amber{background:rgba(245,158,11,.18);color:#fcd34d}
body.dark .badge.red{background:rgba(239,68,68,.18);color:#fca5a5}
body.dark .badge.gray{background:rgba(156,163,175,.18);color:#d1d5db}
body.dark .badge.blue{background:rgba(59,130,246,.18);color:#93c5fd}
body.dark .badge.purple{background:rgba(139,92,246,.18);color:#c4b5fd}
body.dark .coop-green{background:rgba(16,185,129,.2);color:#6ee7b7}
body.dark .coop-amber{background:rgba(245,158,11,.2);color:#fcd34d}
body.dark .coop-red{background:rgba(239,68,68,.2);color:#fca5a5}
body.dark .theme-toggle{background:#1a1d24;color:#e5e7eb;border-color:#2a2f38;box-shadow:0 2px 10px rgba(0,0,0,.5)}
body.dark .pkg-block{color:#fca5a5}
body.dark .task-due{color:#fca5a5}

e article:last-child{border:0;padding-right:0}.lc-evidence h3{font-size:14px;font-weight:550;margin-bottom:17px}.lc-kv{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;gap:10px}.lc-kv span{color:var(--lc-muted)}.lc-kv b{font-weight:600}.lc-evidence .lc-link{display:inline-block;margin-top:20px}.lc-help{position:relative;display:inline-block;vertical-align:middle;font-size:12px;color:var(--lc-muted)}.lc-help summary{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--lc-line);border-radius:50%;cursor:pointer;list-style:none}.lc-help summary::-webkit-details-marker{display:none}.lc-help div{position:absolute;right:0;top:28px;background:var(--lc-card);border:1px solid var(--lc-line);border-radius:9px;padding:15px;width:320px;max-width:calc(100vw - 60px);line-height:1.8;box-shadow:0 8px 30px #0002;z-index:210;color:var(--lc-ink);font-weight:400}.lc-help.left div{right:auto;left:0}.lc-table{overflow:auto}.lc-table th,.lc-table td{padding:13px 10px;white-space:nowrap}.lc-table tbody tr:hover{background:var(--lc-soft)}.lc-table a{color:var(--lc-blue)}.lc-empty{text-align:center;padding:28px;color:var(--lc-muted);font-size:13px}.lc-plancounts{display:flex;gap:25px;font-size:13px;margin-bottom:12px}.lc-plancounts b{margin-left:8px}.lc-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.lc-form label{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--lc-muted)}.lc-form .wide{grid-column:span 2}.lc-submit{display:flex;gap:14px;align-items:center;margin-top:18px}.lc-side-links{display:flex;gap:20px;padding:2px 0 20px}.lc-status{font-size:12px;color:var(--lc-muted)}button,a,summary,input,select{touch-action:manipulation}a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--lc-blue);outline-offset:4px}body.dark .lc-panel{box-shadow:none}@media(max-width:760px){body{padding:18px}.lc-header{margin-top:42px}.lc-header h1{font-size:20px}.lc-header span{max-width:130px;text-align:right}.lc-panel{padding:18px}.lc-stage-grid{grid-template-columns:repeat(2,1fr);gap:8px}.lc-stage,.lc-stage:first-child{border:0;padding:10px}.lc-evidence{grid-template-columns:1fr}.lc-evidence article,.lc-evidence article:first-child,.lc-evidence article:last-child{border-right:0;border-bottom:1px solid var(--lc-line);padding:18px 0}.lc-evidence article:last-child{border:0}.lc-form{grid-template-columns:1fr}.lc-form .wide{grid-column:auto}.lc-tools input{margin-left:0;min-width:0;width:100%}.lc-stage-foot{flex-wrap:wrap}.lc-title{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function lcLocalDetail(c){return `<section class="lc-panel"><div class="lc-title"><h2>${h(c.name)}</h2></div><div class="lc-form"><div>账号<div class="lc-muted">${h(c.handle||'待补')}</div></div><div>邮箱<div class="lc-muted">${h(c.email||'待补')}</div></div><div>负责人<div class="lc-muted">${h(c.owner||'未分配')}</div></div><div>国家<div class="lc-muted">${h(c.country||'待补')}</div></div></div></section><section class="lc-panel"><div class="lc-title"><h2>合作证据</h2></div><div class="lc-evidence"><article><h3>订单物流</h3><span class="lc-muted">尚未接入</span></article><article><h3>视频内容</h3><span class="lc-muted">尚未接入</span></article><article><h3>投入产出</h3><span class="lc-muted">暂无资金和产出记录</span></article></div></section>`;}
function lcSaveIntake(onlyKey=null){const status=document.getElementById('lcIntakeStatus')||{set textContent(v){lcInlineNotice=v;lcShowInlineNotice();}};const inline=!!document.getElementById('lcStageTable');const returnHash=lcHash();const rows=lcDraft.filter(r=>(onlyKey===null||r.key===onlyKey)&&['name','handle','email','country','first','next','contact','intent','contract','handoff','plannedBudget','cooperation','settlement','plan','note',...lcCustomFields.map(f=>f.id)].some(k=>r[k]!==undefined&&r[k]!==null&&String(r[k]).trim()));if(!rows.length){status.textContent='请先填写达人名称';return;}
const seen=new Set(DATA.creators.filter(c=>!c.__lcDemo&&c.handle).map(c=>lcHandle(c.handle).toLowerCase()));
for(const r of rows){try{lcCustomDraftValues(r);lcValidateTypedDraft(r);}catch(e){status.textContent='新增数据：'+e.message;return;}const line=lcDraft.indexOf(r)+1;if(!r.name.trim()){status.textContent=`第 ${line} 行缺少达人名称，尚未保存`;return;}const account=lcHandle(r.handle);if(account&&!/^[\w.]+$/.test(account)){status.textContent=`第 ${line} 行请填写 TikTok 账号或完整主页链接，尚未保存`;return;}if(account&&seen.has(account.toLowerCase())){status.textContent=`第 ${line} 行账号已存在或重复，尚未保存`;return;}if(account)seen.add(account.toLowerCase());if(r.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)){status.textContent=`第 ${line} 行邮箱格式不完整，尚未保存`;return;}for(const k of ['plan','review'])if(r[k]&&(!lcDate(r[k])||lcISO(lcDate(r[k]))!==r[k])){status.textContent=`第 ${line} 行日期无效，尚未保存`;return;}if(r.plannedBudget&&(!Number.isFinite(Number(r.plannedBudget))||Number(r.plannedBudget)<0)){status.textContent=`第 ${line} 行拟充值金额无效，尚未保存`;return;}if(r.first&&(!lcDate(r.first)||lcISO(lcDate(r.first))!==r.first||r.first>lcISO(new Date()))){status.textContent=`第 ${line} 行充值日期无效，尚未保存`;return;}}
const added=rows.map(r=>({id:'lc-local-'+(globalThis.crypto?.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)),name:r.name.trim(),handle:lcHandle(r.handle),email:r.email.trim(),owner:r.owner.trim()||'未分配',country:r.country.trim(),stage:r.stage,first:r.first,next:r.next.trim(),contact:r.contact||'',intent:r.intent||'',contract:r.contract||'',handoff:r.handoff||'',plannedBudget:r.plannedBudget||'',cooperation:r.cooperation||'',settlement:r.settlement||'',plan:r.plan||'',review:r.review||'',custom:lcCustomDraftValues(r),note:r.note||''}));const updated=[...lcLocals,...added],mapping=new Map(rows.map((r,i)=>['draft:'+r.key,added[i].id])),rank=new Map(lcLayout.rows.map((id,i)=>[id,i])),base=DATA.creators.map((c,i)=>({c,i})).sort((a,b)=>(rank.get(a.c.id)??(lcLayout.rows.length+a.i))-(rank.get(b.c.id)??(lcLayout.rows.length+b.i))).map(x=>({ref:x.c.id,c:x.c})),order=lcInsertDraftEntries(base,rows).map(x=>mapping.get(x.ref)||x.ref),layout={...lcLayout,rows:order},beforeLocal=lcStore.getItem(LC_LOCAL_KEY),beforeLayout=lcStore.getItem(LC_LAYOUT_KEY);try{lcStore.setItem(LC_LOCAL_KEY,JSON.stringify(updated));lcStore.setItem(LC_LAYOUT_KEY,JSON.stringify(layout));}catch(e){try{if(beforeLocal===null)lcStore.removeItem(LC_LOCAL_KEY);else lcStore.setItem(LC_LOCAL_KEY,beforeLocal);if(beforeLayout===null)lcStore.removeItem(LC_LAYOUT_KEY);else lcStore.setItem(LC_LAYOUT_KEY,beforeLayout);}catch(rollback){}status.textContent='保存失败，资料仍留在表格中，请检查浏览器存储权限';return;}for(const [ref,id] of mapping)if(lcCheckedRows.delete(ref))lcCheckedRows.add(id);lcLayout=layout;lcLocals=updated;DATA.creators.push(...added.map(lcBlankCreator));lcDraft=lcDraft.filter(r=>!rows.includes(r)).map(r=>({...r,__anchor:mapping.get(r.__anchor)||r.__anchor}));if(!inline){lcSearch='';lcOwner='全部';}lcSetRoute(inline?returnHash:'#/cooperation/local');lcInlineNotice=`已保存 ${added.length} 位新增达人`;lcPendingFocusId=added[0]?.id||'';route();}

document.addEventListener('paste',event=>{const target=event.target;if(!target.closest||!target.closest('#lcIntakeTable')||!target.dataset.field)return;const value=event.clipboardData?.getData('text/plain');if(!value||(!value.includes('\t')&&!value.includes('\n')))return;event.preventDefault();const start=lcDraft.findIndex(r=>r.key===Number(target.dataset.key)),col=LC_FIELDS.indexOf(target.dataset.field);if(start<0||col<0)return;const lines=value.replace(/\r\n?/g,'\n').replace(/\n$/,'').split('\n');lines.forEach((line,i)=>{while(lcDraft.length<=start+i)lcDraft.push(lcNewDraft());line.split('\t').forEach((cell,j)=>{const field=LC_FIELDS[col+j];if(!field)return;let v=cell.trim();if(field==='stage'){const match=LC_STAGES.find(x=>x[0]===v||x[1]===v);v=match?match[0]:'unknown';}lcDraft[start+i][field]=v;});});route();});

const LC_BACKUP_KEYS=['creatorwb_record_history_v1','creatorwb_custom_fields_v1','creatorwb_lifecycle_v1','creatorwb_intake_v1','creatorwb_demo_visible_v1','creatorwb_deleted_v1','creatorwb_field_labels_v1','creatorwb_column_widths_v1','creatorwb_page_size_v1','creatorwb_table_order_v1','creatorwb_drawer_drafts_v1','creatorwb_drawer_tab_v1','manual_contents'];
let lcPendingBackup=null;
function lcBackupPanel(){return `<details class="lc-backup-panel"><summary>数据备份</summary><div class="lc-backup-body"><div class="lc-backup-tools"><button class="btn2" onclick="lcExportBackup()">导出数据备份</button><label class="btn2 lc-backup-file">选择备份以恢复<input type="file" accept=".json,application/json" onchange="lcReadBackup(this)"></label>${lcHelp('导出当前浏览器已保存的达人资料、新增达人、删除记录、跟进草稿、手动视频和表格设置，不包含其他应用的数据。新增行需先保存。代码版本由本地 Git 管理。恢复会覆盖这些工作台数据，不改原始嵌入快照；恢复前建议先导出当前数据。')}</div><div id="lcBackupStatus" class="lc-backup-status" role="status"></div><div id="lcBackupReview" hidden><p id="lcBackupDescription"></p><button class="btn" onclick="lcRestoreBackup()">确认覆盖并恢复</button><button class="btn2" onclick="lcCancelBackup()">取消</button></div></div></details>`;}
function lcBackupMessage(message){const el=document.getElementById('lcBackupStatus');if(el)el.textContent=message;}
function lcBuildBackup(){if(typeof lcDraft!=='undefined'&&lcDraft.length)throw Error('请先保存或移除表格中的新增行，再导出');lcDrawerRemember();const storage={};for(const key of LC_BACKUP_KEYS)storage[key]=lcStore.getItem(key);return {format:'creator-growth-workbench',version:1,createdAt:new Date().toISOString(),storage};}
function lcExportBackup(){try{const data=lcBuildBackup(),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='达人工作台-数据备份-'+lcISO(new Date())+'-'+Date.now()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);lcBackupMessage('已发起下载，请确认备份文件已保存。');}catch(e){lcBackupMessage('导出失败：'+e.message);}}
function lcValidateBackup(data){if(!data||data.format!=='creator-growth-workbench'||data.version!==1||!data.storage||typeof data.storage!=='object'||Array.isArray(data.storage))throw Error('不是支持的工作台备份');if(!Object.prototype.hasOwnProperty.call(data.storage,LC_CUSTOM_KEY))data={...data,storage:{...data.storage,[LC_CUSTOM_KEY]:null}};if(!Object.prototype.hasOwnProperty.call(data.storage,LC_AUDIT_KEY))data={...data,storage:{...data.storage,[LC_AUDIT_KEY]:null}};const keys=Object.keys(data.storage);if(keys.length!==LC_BACKUP_KEYS.length||keys.some(k=>!LC_BACKUP_KEYS.includes(k)))throw Error('备份字段不完整或包含未知字段');for(const key of LC_BACKUP_KEYS){const value=data.storage[key];if(value===null)continue;if(typeof value!=='string')throw Error('备份字段类型错误');if(key.endsWith('demo_visible_v1')){if(!['visible','hidden'].includes(value))throw Error('演示设置无效');}else if(key.endsWith('page_size_v1')){if(!['10','25','50','100'].includes(value))throw Error('分页设置无效');}else if(key.endsWith('drawer_tab_v1')){if(!['overview','content','logistics','returns','cooperation','history'].includes(value))throw Error('抽屉设置无效');}else{const parsed=JSON.parse(value),array=key===LC_AUDIT_KEY||key==='manual_contents'||key.endsWith('intake_v1')||key===LC_CUSTOM_KEY;if(key===LC_CUSTOM_KEY)lcValidateCustomSchema(parsed);if(array?!Array.isArray(parsed):(!parsed||typeof parsed!=='object'||Array.isArray(parsed)))throw Error('备份数据结构错误');}}return data;}
async function lcReadBackup(input){lcCancelBackup();try{const file=input.files?.[0];if(!file)return;if(file.size>25*1024*1024)throw Error('备份文件超过 25 MB');const data=lcValidateBackup(JSON.parse(await file.text()));lcPendingBackup=data;const date=new Date(data.createdAt),time=Number.isNaN(+date)?'时间未记录':date.toLocaleString('zh-CN');document.getElementById('lcBackupDescription').textContent='备份时间：'+time+'。恢复将覆盖当前浏览器的达人资料、跟进记录、手动视频及表格设置；不是合并。';document.getElementById('lcBackupReview').hidden=false;lcBackupMessage('备份校验通过，尚未覆盖任何数据。');}catch(e){lcBackupMessage('无法读取：'+e.message);}finally{input.value='';}}
function lcCancelBackup(){lcPendingBackup=null;const review=document.getElementById('lcBackupReview');if(review)review.hidden=true;lcBackupMessage('');}
function lcApplyBackup(data){data=lcValidateBackup(data);const before={};for(const key of LC_BACKUP_KEYS)before[key]=lcStore.getItem(key);try{for(const key of LC_BACKUP_KEYS){const value=data.storage[key];if(value===null)lcStore.removeItem(key);else lcStore.setItem(key,value);}}catch(e){let failed=false;for(const key of LC_BACKUP_KEYS)try{if(before[key]===null)lcStore.removeItem(key);else lcStore.setItem(key,before[key]);}catch(rollback){failed=true;}throw Error(failed?'恢复失败，回滚未完全成功，请保留备份文件并重试':'恢复失败，已还原原数据：'+e.message);}}
function lcRestoreBackup(){if(!lcPendingBackup)return;try{lcApplyBackup(lcPendingBackup);lcPendingBackup=null;lcBackupMessage('恢复完成，正在刷新。');location.reload();}catch(e){lcBackupMessage(e.message);}}

function lcOrderRows(rows,filter){const rules=lcSortRules(filter),rank=new Map(lcLayout.rows.map((id,i)=>[id,i])),base=new Map(DATA.creators.map((c,i)=>[c.id,i]));return rows.slice().sort((a,b)=>{for(const rule of rules){const x=lcSortValue(a,rule.key),y=lcSortValue(b,rule.key);if(x===null&&y===null)continue;if(x===null)return 1;if(y===null)return -1;const diff=typeof x==='number'?x-y:x.localeCompare(y,'zh-CN',{numeric:true,sensitivity:'base'});if(diff)return rule.dir==='desc'?-diff:diff;}return (rank.get(a.id)??(lcLayout.rows.length+base.get(a.id)))-(rank.get(b.id)??(lcLayout.rows.length+base.get(b.id)));});}
function lcUpdateSorts(rules){const f=lcInlineFilter();if(lcSaveLayout({...lcLayout,sorts:{...lcLayout.sorts,[f]:rules}})){lcPage=1;route();}}
function lcAddSort(){const rules=lcSortRules();const key=lcBaseColumns('all').find(([k])=>k!=='evidence'&&!rules.some(r=>r.key===k))?.[0];if(key){lcSortOpen=true;lcUpdateSorts([...rules,{key,dir:'asc'}]);}}
function lcEditSort(index,key,value){const rules=lcSortRules().map(r=>({...r}));if(!rules[index])return;if(key==='key'&&rules.some((r,i)=>i!==index&&r.key===value)){lcInlineNotice='这个字段已在排序规则中';route();return;}rules[index][key]=value;lcUpdateSorts(rules);}
function lcMoveSort(index,delta){const rules=lcSortRules().map(r=>({...r})),target=index+delta;if(target<0||target>=rules.length)return;[rules[index],rules[target]]=[rules[target],rules[index]];lcUpdateSorts(rules);}
function lcColumnLabel(filter,key){const hit=lcBaseColumns(filter).find(([k])=>k===key)||lcBaseColumns('all').find(([k])=>k===key);return hit?lcHeaderName(hit[0],hit[1]):key;}
function lcColumnHidden(filter,key){return (lcLayout.hidden?.['__all']||[]).includes(key);}
function lcToggleColumnHidden(key,show){const cur=new Set(lcLayout.hidden?.['__all']||[]);if(show)cur.delete(key);else cur.add(key);if(lcSaveLayout({...lcLayout,hidden:{...(lcLayout.hidden||{}),__all:[...cur]}})){route();}}
function lcShowAllColumns(){if(lcSaveLayout({...lcLayout,hidden:{...(lcLayout.hidden||{}),__all:[]}})){lcFieldsOpen=false;route();}}
function lcFieldUnion(){const seen=new Map([['ticket','要做的事'],['ticketCat','未处理事项分类'],['ticketProgress','进展'],['ticketRaised','提出日期']]);['all',...LC_STAGES.map(x=>x[0])].forEach(f=>lcBaseColumns(f).forEach(([k,n])=>{if(['evidence','__actions'].includes(k))return;if(!seen.has(k))seen.set(k,n);}));lcCustomFields.forEach(f=>{if(!seen.has(f.id))seen.set(f.id,f.name||'自定义字段');});return [...seen.entries()];}
function lcFieldsPanel(filter){if(!lcFieldsOpen)return '';const cols=lcFieldUnion();const shown=cols.filter(([k])=>!lcColumnHidden(filter,k)).length;return `<section class="lc-sort-panel lc-popover lc-fields-pop" role="dialog" aria-label="字段配置" onclick="event.stopPropagation()"><div class="lc-title"><h3>字段配置</h3><button class="lc-plain" onclick="lcFieldsOpen=false;route()">收起</button></div><p class="lc-muted" style="margin:0 0 10px;font-size:12px">当前显示 ${shown} / ${cols.length} 列。一套配置全站共用，所有视图和达人详情都跟着变。</p><div class="lc-fields-grid">${cols.map(([k,n])=>`<label><input type="checkbox" ${lcColumnHidden(filter,k)?'':'checked'} onchange="lcToggleColumnHidden('${k}',this.checked)"><span>${h(lcHeaderName(k,n))}</span></label>`).join('')}</div><div class="lc-fields-actions"><button class="lc-plain" onclick="lcShowAllColumns()">全部显示</button></div></section>`;}
function lcGroupPanel(filter){if(!lcGroupOpen)return '';const fields=lcBaseColumns('all').filter(([k])=>!['evidence','__actions','name','handle'].includes(k));return `<section class="lc-sort-panel lc-popover" role="dialog" aria-label="按字段分组" onclick="event.stopPropagation()"><div class="lc-title"><h3>按字段分组</h3><button class="lc-plain" onclick="lcGroupOpen=false;route()">收起</button></div><div class="lc-sort-rule"><span>分组字段</span><select aria-label="分组字段" onchange="lcSetGroup(this.value)"><option value="">不分组</option>${fields.map(([k,n])=>`<option value="${k}" ${lcGroupKey===k?'selected':''}>${h(lcHeaderName(k,n))}</option>`).join('')}</select></div><p class="lc-muted" style="margin:8px 0 0;font-size:12px">同一字段值的达人会归到一组，组内仍按当前排序显示。</p></section>`;}
function lcSortPanel(filter){const rules=lcSortRules(filter),fields=lcBaseColumns('all').filter(([k])=>k!=='evidence');if(!lcSortOpen)return '';return `<section class="lc-sort-panel lc-popover" role="dialog" aria-label="多字段排序" onclick="event.stopPropagation()"><div class="lc-title"><h3>多字段排序</h3><button class="lc-plain" onclick="lcSortOpen=false;route()">收起</button></div>${rules.map((r,i)=>`<div class="lc-sort-rule"><span>${i===0?'首先按':'再按'}</span><select aria-label="排序字段${i+1}" onchange="lcEditSort(${i},'key',this.value)">${fields.map(([k,n])=>`<option value="${k}" ${r.key===k?'selected':''}>${h(lcHeaderName(k,n))}</option>`).join('')}</select><select aria-label="排序方向${i+1}" onchange="lcEditSort(${i},'dir',this.value)"><option value="asc" ${r.dir==='asc'?'selected':''}>升序（A→Z / 小→大 / 早→晚）</option><option value="desc" ${r.dir==='desc'?'selected':''}>降序（Z→A / 大→小 / 晚→早）</option></select><button class="lc-plain" aria-label="提高排序优先级${i+1}" onclick="lcMoveSort(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="lc-plain" aria-label="降低排序优先级${i+1}" onclick="lcMoveSort(${i},1)" ${i===rules.length-1?'disabled':''}>↓</button><button class="lc-plain" onclick="lcUpdateSorts(lcSortRules().filter((r,i)=>i!==${i}))">移除</button></div>`).join('')||'<div class="lc-muted">当前使用手动顺序</div>'}<div class="lc-sort-bottom"><button class="btn2" onclick="lcAddSort()">＋ 添加排序条件</button><button class="lc-plain" onclick="lcUpdateSorts([])">清除排序，恢复手动顺序</button><span class="lc-muted">空值始终排在最后</span></div></section>`;}
function lcMoveColumn(source,target,after=false){const f=lcInlineFilter(),keys=lcDisplayColumns(f).map(x=>x[0]);if(source===target||!keys.includes(source)||!keys.includes(target))return;keys.splice(keys.indexOf(source),1);keys.splice(keys.indexOf(target)+(after?1:0),0,source);if(lcSaveLayout({...lcLayout,columns:{...lcLayout.columns,[f]:keys}}))route();}
function lcMoveRow(source,target,after=false){if(lcSortRules().length){lcInlineNotice='请先清除字段排序，再调整手动行顺序';lcShowInlineNotice();return;}if(source===target)return;const rank=new Map(lcLayout.rows.map((id,i)=>[id,i]));const ids=DATA.creators.map(c=>c.id).sort((a,b)=>(rank.get(a)??100000)-(rank.get(b)??100000));if(!ids.includes(source)||!ids.includes(target))return;ids.splice(ids.indexOf(source),1);ids.splice(ids.indexOf(target)+(after?1:0),0,source);if(lcSaveLayout({...lcLayout,rows:ids}))route();}
function lcMoveRowTo(id,value){if(lcSortRules().length){lcInlineNotice='请先切回手动顺序';lcShowInlineNotice();return;}const rows=lcOrderRows(lcFilterRows(lcInlineFilter()),lcInlineFilter());let pos=Math.floor(Number(value));if(!Number.isFinite(pos)||pos<1||pos>rows.length){lcInlineNotice=`位置应在 1–${rows.length} 之间`;lcShowInlineNotice();return;}const target=rows[pos-1];if(target&&target.id!==id){lcPendingFocusId=id;const src=rows.findIndex(c=>c.id===id);lcMoveRow(id,target.id,src<pos-1);}}
function lcRowControl(c,index){return `<td class="lc-row-control"><button class="lc-row-grip" draggable="true" data-drag-row="${c.id}" title="拖动换行；Alt＋方向键上下移动" aria-label="拖动${h(c.name)}行" onkeydown="if(event.altKey&&['ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();lcMoveRowTo('${c.id}',${index+1}+(event.key==='ArrowUp'?-1:1));}">⠿</button><span class="lc-row-index"><input class="lc-row-position" data-row-position="${c.id}" readonly tabindex="-1" type="number" min="1" value="${index+1}" aria-label="${h(c.name)}移动到第几行" title="填写位置可跨页移动" onchange="lcMoveRowTo('${c.id}',this.value)">${lcRowCheckbox(c.id,c.name)}</span></td>`;}
function lcActionCell(c,isNew){return `<td>${isNew?`<button class="lc-plain" onclick="lcDropInline(${c.key})" aria-label="删除未保存行">×</button>`:`<button class="lc-delete-record" onclick="lcDeleteCreator('${c.id}')" aria-label="删除${h(c.name)}">删除</button>`}</td>`;}

cMoveRowGhost(event);

function lcMoveRowGhost(event){const v=lcDragVisual;if(!v)return;if(Number.isFinite(event.clientX))v.x=event.clientX;if(Number.isFinite(event.clientY))v.y=event.clientY;const width=parseFloat(v.ghost.style.width)||600;v.ghost.style.left=Math.max(12,Math.min(v.x+16,window.innerWidth-width-12))+'px';v.ghost.style.top=Math.max(12,Math.min(v.y+18,window.innerHeight-105))+'px';}
function lcPreviewRowTarget(target,y){const v=lcDragVisual;if(!v||!target||target===v.source)return;const rect=target.getBoundingClientRect(),after=y>rect.top+rect.height/2;v.targetId=target.dataset.rowId;v.after=after;target.parentNode.insertBefore(v.slot,after?target.nextSibling:target);const rows=lcOrderRows(lcFilterRows(lcInlineFilter()),lcInlineFilter()),sourceIndex=rows.findIndex(c=>c.id===lcDragItem?.key),targetIndex=rows.findIndex(c=>c.id===v.targetId);let destination=targetIndex+(after?1:0);if(sourceIndex<destination)destination--;destination=Math.max(0,destination)+1;v.slot.querySelector('.lc-drop-slot-label').textContent='松开，移到第 '+destination+' 行';v.ghost.querySelector('.lc-ghost-title').textContent='正在移动 · '+(DATA.creators.find(c=>c.id===lcDragItem?.key)?.name||'达人')+' · 第 '+destination+' 行';}
function lcDragAutoScroll(){const v=lcDragVisual;if(!v)return;const edge=65;if(v.y<edge)window.scrollBy(0,-12);else if(v.y>window.innerHeight-edge)window.scrollBy(0,12);const rect=v.wrap.getBoundingClientRect();if(v.y>=rect.top&&v.y<=rect.bottom){if(v.x<rect.left+35)v.wrap.scrollLeft-=12;else if(v.x>Math.min(rect.right,window.innerWidth)-35)v.wrap.scrollLeft+=12;}const hit=document.elementFromPoint?.(v.x,v.y)?.closest?.('#lcStageTable tr[data-row-id]');if(hit)lcPreviewRowTarget(hit,v.y);lcDragScrollFrame=requestAnimationFrame(lcDragAutoScroll);}
document.addEventListener('dragstart',event=>{const row=event.target.closest?.('[data-drag-row]'),col=event.target.closest?.('[data-drag-column]');if(!row&&!col)return;if(row&&lcSortRules().length){event.preventDefault();lcInlineNotice='请先清除字段排序，再拖动行';lcShowInlineNotice();return;}lcDragCleanup();lcDragItem=row?{type:'row',key:row.dataset.dragRow}:{type:'column',key:col.dataset.dragColumn};if(event.dataTransfer){event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',lcDragItem.key);}if(row)lcStartRowVisual(row,event);else event.target.classList.add('lc-dragging');});

document.addEventListener('drop',event=>{if(!lcDragItem)return;const item=lcDragItem;lcDragItem=null;if(item.type==='row'){const target=event.target.closest?.('#lcStageTable tr[data-row-id]'),slot=event.target.closest?.('#lcRowDropSlot');let targetId=target?.dataset.rowId,after=false;if(slot&&lcDragVisual){targetId=lcDragVisual.targetId;after=lcDragVisual.after;}else if(target){const rect=target.getBoundingClientRect();after=event.clientY>rect.top+rect.height/2;}lcDragCleanup();if(targetId){event.preventDefault();lcMoveRow(item.key,targetId,after);}return;}const target=event.target.closest?.('th[data-col-key]');lcDragCleanup();if(target){event.preventDefault();const rect=target.getBoundingClientRect();lcMoveColumn(item.key,target.dataset.colKey,event.clientX>rect.left+rect.width/2);}});

function lcParcelStateKey(p,i){const lbl=String(p.scmLabel||'');if(/待支付|待付款|欠费/.test(lbl))return 'unpaid';if(i.noTrack)return 'noTrack';if(i.stage==='pending')return 'unpaid';if(i.stage==='ended')return 'ended';if(/取消|退回/.test(lbl))return 'ended';if(/退回|取消|returned|cancel/i.test(String(p.trkSub||'')))return 'ended';if(/过期|expired/i.test(String(p.trkStatus||'')+String(p.trk||'')))return 'expired';if(i.noTrace)return 'noTrace';if(i.explicit)return 'exception';if(i.unclear)return 'unclear';if(i.stage==='delivered')return 'delivered';return 'normal';}
function lcParcelStateText(p,i){const key=lcParcelStateKey(p,i);if(key==='exception'){const sub=lcParcelSubCn(String(p.trkSub||'').trim());return sub||lcParcelSubCn(String(p.trkStatus||'异常'));}if(key!=='normal'&&key!=='delivered'&&key!=='exception')return (LC_PARCEL_STATES.find(([k])=>k===key)||[])[1]||'';if(key==='delivered')return '正常（已签收）';return '正常';}
function lcParcelStateOld(p,i){const scmLbl=String(p.scmLabel||'');if(/待支付|待付款|欠费/.test(scmLbl))return '待付款／补款';if(/取消|退回/.test(scmLbl))return '取消／退回';if(i.noTrack)return '运单号待补';if(i.stage==='pending')return '待付款／补款';if(i.stage==='ended')return '取消／退回';if(/过期|expired/i.test(String(p.trkStatus||'')+String(p.trk||'')))return '已过期';if(i.noTrace)return '查不到轨迹';if(/退回|取消|returned|cancel/i.test(String(p.trkSub||'')+String(p.trk||'')))return '取消／退回';const sub=lcParcelSubCn(String(p.trkSub||'').trim());if(i.explicit)return sub||lcParcelSubCn(String(p.trkStatus||'异常'));if(i.unclear)return '状态待确认';if(i.stage==='delivered')return '正常（已签收）';return '正常';}
function lcParcelMatches(i,key,p){if(key.startsWith('st:')){return lcParcelStateKey(p||{},i)===key.slice(3);}if(key==='warehouse')return i.stage==='warehouse'||i.stage==='pending';return key==='all'||(key==='attention'?i.attention:['explicit','stale','unclear','noTrack','noTrace','tax','near'].includes(key)?i[key]:i.stage===key);}
function lcParcelDetail(p){const i=lcParcelInfo(p),track=p.track&&p.track!=='—'?String(p.track):'',fields=[['包裹号',p.pid],['物流单号',track],['承运商',p.carrier],['运输阶段',lcParcelLabel(i.stage)],['原始状态',p.status],['最新物流轨迹',p.trk],['最后轨迹时间',i.lastTrackAt||'未记录完整时间'],['距最后轨迹',i.days===null?'暂不可计算':i.days+' 天（按已记录轨迹）'],['最后成功查询时间',p.lastCheckedAt||'未记录 · 历史快照'],['包裹金额',p.amount==null?'待补':'¥'+fmt(p.amount)]];
return `<details class="lc-parcel-detail"><summary><span><strong>${h(p.pid||'包裹号待补')}</strong><small>${h(lcParcelLabel(i.stage))} · ${h(p.status||'原始状态待补')}</small></span><span class="lc-parcel-tags">${lcParcelTags(i)}</span></summary><dl>${fields.map(([name,value])=>`<div><dt>${name}</dt><dd>${h(value||'待补')}</dd></div>`).join('')}</dl>${i.explicit?`<div class="lc-parcel-reason"><strong>异常依据</strong><p>${h([p.status,p.trk].filter(Boolean).join(' · '))}</p></div>`:''}${i.stale?`<p class="lc-parcel-reason">已记录轨迹距今 ${i.days} 天；请查询当前物流核实。</p>`:''}${track?`<a class="lc-link" href="https://t.17track.net/zh-cn#nums=${encodeURIComponent(track)}" target="_blank" rel="noopener">前往 17TRACK 查询完整轨迹 ↗</a>`:'<span class="lc-muted">暂无可查询的物流单号</span>'}</details>`;
}

function lcVideoDate(value){if(!/^\d{4}-\d{2}-\d{2}(?:[T\s]|$)/.test(String(value||'')))return '';const day=String(value).slice(0,10),d=lcDate(day);return d&&lcISO(d)===day?day:'';}
function lcVideoSummaryData(c,period='7',today=lcISO(new Date())){const all=[...(c.contents||[]),...getManual().filter(v=>v.creatorId===c.id)],dated=all.map(v=>({v,date:lcVideoDate(v.date)})).filter(x=>x.date&&x.date<=today).sort((a,b)=>b.date.localeCompare(a.date));const d=lcDate(today);if(period==='month')d.setDate(1);else d.setDate(d.getDate()-(period==='30'?29:6));const start=period==='all'?'':lcISO(d),scope=period==='all'?all.map(v=>({v,date:lcVideoDate(v.date)})).sort((a,b)=>b.date.localeCompare(a.date)):dated.filter(x=>x.date>=start),matched=dated.filter(x=>x.v.source!=='manual'&&x.v.brand===true);return {all,dated,start,today,scope,latest:dated[0],brandLatest:matched[0],brandCount:scope.filter(x=>x.v.source!=='manual'&&x.v.brand===true).length,unknownDates:all.filter(v=>!lcVideoDate(v.date)).length};}

function lcVideoSummary(c,detailed=false){const period=lcVideoPeriods[c.id]||'7',data=lcVideoSummaryData(c,period),has=data.all.length>0;const recent=(label,entry)=>`<div class="lc-video-recent"><span>${label}</span><strong>${entry?h(entry.date):'暂无已获取记录'}</strong>${entry?`<small>距今 ${-lcDayDiff(entry.date)} 天</small>`:''}</div>`;const stat=(name,value)=>`<div class="lc-overview-stat"><span>${name}</span><strong>${h(value)}</strong></div>`;
return `<section class="lc-panel lc-video-summary"><div class="lc-title"><h2>视频发布概况</h2>${detailed?'<button class="lc-link lc-plain" onclick="document.getElementById(\'lcVideoRecords\').scrollIntoView({block:\'start\',behavior:\'smooth\'})">查看记录 ↓</button>':'<button class="lc-link lc-plain" onclick="lcDrawerTab(\'content\')">查看全部 →</button>'}</div><div class="lc-parcel-source">已获取记录 · 历史快照${DATA.today?'（原始快照 '+h(DATA.today)+'）':''}</div><div class="lc-video-recents">${recent('最近发布视频',data.latest)}${recent('最近品牌文字命中视频',data.brandLatest)}</div><div class="lc-video-periods" role="group" aria-label="视频统计周期">${[['7','近7天'],['30','近30天'],['month','本月'],['all','全部']].map(([k,label])=>`<button type="button" class="${period===k?'active':''}" aria-pressed="${period===k}" onclick="lcVideoSetPeriod('${k}')">${label}</button>`).join('')}</div><div class="lc-overview-period">${period==='all'?'全部已获取记录':h(data.start)+' 至 '+h(data.today)+' · 已获取记录'}</div><div class="lc-overview-stats lc-video-counts">${stat('发布视频',has?data.scope.length+' 条':'待获取')}${stat('品牌文字命中',has?data.brandCount+' 条':'待获取')}${stat('人工确认相关','待接入')}${stat('待审核','待确认')}</div>${data.unknownDates?`<div class="lc-muted lc-video-date-note">${data.unknownDates} 条记录缺少有效发布日期，${period==='all'?'已包含在全部记录中':'未计入周期统计，可在「全部」查看'}</div>`:''}${lcHelp('最近发布时间不受周期切换限制。近7天、近30天均包含今天，本月从1日起算。周期内数量与下方视频列表同步筛选；全部仅指全部已获取记录，不代表账号完整历史或实时更新。缺少发布日期的记录仅在全部中展示，最近发布时间仍仅依据明确日期。品牌命中只依据文案与标签，未命中不等于未推广；现有数据没有可靠的人工审核字段，因此不推算人工确认数、待审核数，也不把文字未命中当作待审核。人工确认数据接入前，最近品牌相关时间明确标为品牌文字命中时间。')}</section>`;}

${c.coopStart?`<span><b>合作时间</b>${h(c.coopStart)}</span>`:''}${c.tutorial?`<span><b>教程视频</b>${h(c.tutorial==='是'?'已发布':'未发布')}</span>`:''}${c.channel?`<span><b>沟通渠道</b>${h(c.channel)}</span>`:''}${c.coopTerms?`<span><b>合作条件</b>${h(c.coopTerms)}</span>`:''}${c.affiliate?`<span><b>联盟链接</b>${h(c.affiliate)}</span>`:''}${c.social?`<span><b>社媒</b>${h(String(c.social).replace(/\n/g,' '))}</span>`:''}</section>`:'';

function lcSyncProfileAccount(source){const a=document.getElementById('lcProfileHandle'),u=document.getElementById('lcProfileURL');if(!a||!u)return;const raw=(source==='url'?u.value:a.value).trim(),handle=lcHandle(raw);if(!raw||(/^[\w.]+$/.test(handle)&&(source!=='url'||/^https?:\/\/(?:www\.)?tiktok\.com\/@[^/?#]+\/?(?:[?#].*)?$/i.test(raw)))){a.value=handle;u.value=handle?'https://www.tiktok.com/@'+handle:'';}lcDrawerRemember();}

function lcHandleUrl(v){const t=String(v||'').trim();if(!t)return '';if(/^https?:\/\//i.test(t))return t;if(!/^[A-Za-z0-9_.]{2,30}$/.test(t.replace(/^@/,'')))return '';return 'https://www.tiktok.com/@'+t.replace(/^@/,'');}

function lcEditor(c){const r=lcRecord(c);return `<section class="lc-panel"><div class="lc-title"><h2>合作与跟进记录</h2>${lcHelp('由 BD 核对后补录，只保存在当前浏览器。首次充值起算，默认两个月后的同日复盘；跨月取目标月最后一天。到期只提示，不自动续约或结束。暂停与结束可在备注中写清，未结款项仍需核对。')}</div><form onsubmit="event.preventDefault();lcSave('${c.id}')"><div class="lc-form"><label>合作阶段<select id="lcStage"><option value="unknown">待确认</option>${LC_STAGES.map(([k,n])=>`<option value="${k}" ${r.stage===k?'selected':''}>${n}</option>`).join('')}</select></label><label>首次充值日期<input id="lcFirst" type="date" value="${h(r.first||'')}" max="${lcISO(new Date())}"></label><label>复盘日期（留空按首次充值推算）<input id="lcReview" type="date" value="${h(r.review||'')}"></label><label class="wide">下一步<input id="lcNext" value="${h(r.next||'')}" placeholder="由 BD 填写"></label><label>计划日期<input id="lcPlan" type="date" value="${h(r.plan||'')}"></label><label class="wide">复盘决定 / 备注<input id="lcNote" value="${h(r.note||'')}"></label></div><div class="lc-submit"><button class="btn" type="submit">保存记录</button><span class="lc-status" id="lcSaveStatus" role="status"></span></div></form></section>`;}
function lcSave(id){const c=DATA.creators.find(c=>c.id===id);if(!c)return;const root=lcDrawer.id===id?(document.getElementById('lcCreatorDrawer')||document.getElementById('lcCreatorPage')):document.getElementById('app'),get=key=>root.querySelector('#'+key),status=get('lcSaveStatus'),fail=message=>{if(status)status.textContent='保存失败：'+message;const footer=root.querySelector('#lcDrawerDraftStatus');if(footer)footer.textContent='保存失败：'+message;return false;};
const r={...lcRecord(c),stage:get('lcStage').value,first:get('lcFirst').value,review:get('lcReview').value,next:get('lcNext').value,plan:get('lcPlan').value,note:get('lcNote').value};
for(const key of ['first','review','plan'])if(r[key]&&(!lcDate(r[key])||lcISO(lcDate(r[key]))!==r[key]))return fail('日期无效');if(r.first>lcISO(new Date()))return fail('首次充值日期不能晚于今天');
const ids={name:'lcProfileName',handle:'lcProfileHandle',email:'lcProfileEmail',country:'lcProfileCountry',owner:'lcDrawerOwner'},profile={...(r.profile||{})};for(const [key,field] of Object.entries(ids)){const el=get(field);if(el)profile[key]=el.value.trim();}
if(get('lcProfileName')&&!profile.name)return fail('达人名称不能为空');if(get('lcProfileEmail')&&profile.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(profile.email))return fail('邮箱格式不完整');
if(get('lcProfileHandle')){profile.handle=lcHandle(profile.handle);if(profile.handle&&!/^[\w.]+$/.test(profile.handle))return fail('请填写有效的 TikTok 账号');const url=get('lcProfileURL').value.trim();if(url&&(!/^https?:\/\/(?:www\.)?tiktok\.com\/@[^/?#]+\/?(?:[?#].*)?$/i.test(url)||lcHandle(url).toLowerCase()!==profile.handle.toLowerCase()))return fail('主页链接须与 TikTok 账号一致');if(profile.handle&&DATA.creators.some(x=>x.id!==id&&x.handle&&lcHandle(x.handle).toLowerCase()===profile.handle.toLowerCase()))return fail('账号已经存在，请核对重复达人');}
if(get('lcDrawerOwner'))profile.owner=profile.owner||'未分配';r.profile=profile;const candidate={...lcRecords,[id]:r};try{lcStore.setItem(LC_KEY,JSON.stringify(candidate));lcRecords=candidate;lcApplyProfile(c,r);if(status)status.textContent='已保存在当前浏览器';lcDrawerAfterSave(id);}catch(e){return fail('请检查浏览器存储权限');}}

let lcShipping={view:'overview',parcelStage:'all',filter:'focus',search:'',page:1,size:25,key:''};

function lcOpsSet(kind,key,value){const state=kind==='content'?lcMonitor:lcShipping;state[key]=value;if(key!=='page')state.page=1;route();}
function lcOpsPeople(state){return DATA.creators.filter(c=>(lcOwner==='全部'||(c.owner||'未分配')===lcOwner)&&(!state.stage||state.stage==='all'||lcStage(c)===state.stage)&&(!state.search||(c.name+' '+c.handle).toLowerCase().includes(state.search.toLowerCase())));}
function lcOpsPerson(c,tab){return `<button class="lc-link lc-plain" onclick="lcOpsOpen('${h(c.id)}','${tab}',this)">${h(c.name)}</button>`;}
function lcOpsOpen(id,tab,trigger){lcDrawerRemember();lcDrawer.focus=trigger||document.activeElement;lcDrawer.scrollY=window.scrollY;lcDrawer.id=id;lcDrawer.tab=tab;lcDrawer.queue=[...lcOpsQueue];if(tab==='content')lcVideoPeriods[id]='all';if(tab==='logistics'){lcParcelFilters[id]='all';lcParcelFilter='all';}lcRenderDrawer();document.querySelector('.lc-drawer-close')?.focus({preventScroll:true});}
function lcOpsPage(kind,headers,rows,empty){const state=kind==='content'?lcMonitor:lcShipping,key=JSON.stringify([lcOwner,state.stage,state.filter,state.search,state.view,kind==='content'?lcHomePeriod:'']);if(state.key!==key){state.page=1;state.key=key;}const pages=Math.max(1,Math.ceil(rows.length/state.size));state.page=Math.max(1,Math.min(state.page,pages));const shown=rows.slice((state.page-1)*state.size,state.page*state.size);return `<div class="lc-table lc-ops-table"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${shown.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}" class="lc-empty">${h(empty)}</td></tr>`}</tbody></table></div><div class="lc-finance-pagination"><label>共 ${rows.length} 条 · 每页 <select aria-label="每页条数" onchange="lcOpsSet('${kind}','size',Number(this.value))">${[10,25,50,100].map(n=>`<option ${state.size===n?'selected':''}>${n}</option>`).join('')}</select> 条</label><span>${state.page} / ${pages}</span><button class="btn2" ${state.page===1?'disabled':''} onclick="lcOpsSet('${kind}','page',${state.page-1})">上一页</button><button class="btn2" ${state.page===pages?'disabled':''} onclick="lcOpsSet('${kind}','page',${state.page+1})">下一页</button></div>`;}

function lcMonitorMatch(v,filter){return filter==='all'||(filter==='brand'?v.source!=='manual'&&v.brand===true:filter==='unmatched'?v.source!=='manual'&&v.brand===false:filter==='unknown'?v.source==='manual'||typeof v.brand!=='boolean':false);}
function lcMonitorData(){const people=lcOpsPeople(lcMonitor),range=lcHomeWindow();return people.map(c=>{const all=lcVideoSummaryData(c,'all',range.end),videos=all.dated.filter(x=>x.date>=range.start&&x.date<=range.end);return {c,all,videos,brand:videos.filter(x=>lcMonitorMatch(x.v,'brand')).length,unmatched:videos.filter(x=>lcMonitorMatch(x.v,'unmatched')).length,unknown:videos.filter(x=>lcMonitorMatch(x.v,'unknown')).length};});}

function lcContentDeliveryData(c){const end=lcVideoDate(DATA.today),startDate=lcDate(end);startDate.setDate(startDate.getDate()-LC_CONTENT_SIGNED_DAYS+1);const start=lcISO(startDate),ps=(c.parcels||[]).map(p=>({p,info:lcParcelInfo(p,Date.parse(end+'T23:59:59Z')),signed:lcVideoDate(p.signedAt||p.deliveredAt||'')})),near=ps.filter(x=>x.info.near),signed=ps.filter(x=>x.info.stage==='delivered'),recent=signed.filter(x=>x.signed&&x.signed>=start&&x.signed<=end),undated=signed.filter(x=>!x.signed),latest=recent.map(x=>x.signed).sort().at(-1)||'',videos=lcVideoSummaryData(c,'all',end),after=latest?videos.dated.filter(x=>x.date>=latest&&x.date<=end&&lcMonitorMatch(x.v,'brand')):[];return {near,recent,undated,latest,videos,after,start,end};}

function mountBoard(){
  var fr=document.getElementById('boardFrame');
  if(!fr || fr.getAttribute('data-mounted')) return;
  try{
    var bin=atob(window.BOARD_B64||'');
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    fr.srcdoc=new TextDecoder('utf-8').decode(bytes);
    fr.setAttribute('data-mounted','1');
  }catch(e){}
}

  return `<div class="lc-bd-tools">
    <select aria-label="批次" onchange="lcBdSwitch(this.value)">${lcBdState.batches.map(b=>`<option${b===lcBdState.batch?' selected':''}>${h(b)}</option>`).join('')}</select>
    <button class="lc-bd-btn" onclick="lcBdNewBatch()">新建批次</button>
    <button class="lc-bd-btn primary" onclick="lcBdToggleImport()">导入名单</button>
    <button class="lc-bd-btn" onclick="lcBdExport()">导出名单</button>
    <button class="lc-bd-btn" onclick="lcBdTplToggle()">改模板</button>
    <button class="lc-bd-btn" onclick="lcBdSetToggle()">发送设置</button>
    <button class="lc-bd-btn" onclick="lcBdQueueToggle()">发送队列</button>
    ${(lcBdState.blocked||[]).length?`<span class="lc-bd-msg">黑名单 ${lcBdState.blocked.length} 人</span>`:''}
    <button class="lc-bd-btn primary" onclick="lcBdQueueAll()">加入发送队列</button>
    ${lcBdMsg?`<span class="lc-bd-msg">${h(lcBdMsg)}</span>`:''}
  </div>

  ${lcBdTplOpen?lcBdTplPanel():''}
  ${lcBdImportOpen?`<div class="lc-bd-import"><textarea id="lcBdText" placeholder="一行一个人，直接粘邮箱即可，例如：\ncreator@gmail.com\nanother@gmail.com,handle_name"></textarea><div class="lc-bd-tools"><button class="lc-bd-btn primary" onclick="lcBdDoImport()">确认导入</button><button class="lc-bd-btn" onclick="lcBdToggleImport()">取消</button></div></div>`:''}
  <div class="lc-state-chips lc-bd-chips">${chips.map(([k,n,c])=>`<button class="lc-state-chip${lcBdFilter===k?' is-on':''}" onclick="lcBdFilterSet('${k}')">${n} <b>${c}</b></button>`).join('')}</div>
  <div class="lc-ops-table"><table><thead><tr><th>达人</th><th>账号</th><th>邮箱</th><th>粉丝</th><th>状态</th><th>下一步</th><th>操作</th></tr></thead><tbody>${rows||`<tr><td colspan="7"><div class="lc-empty">这个批次还没有人，点“导入名单”粘贴邮箱开始</div></td></tr>`}</tbody></table></div>`;}
function lcBdTplToggle(){lcBdTplOpen=!lcBdTplOpen;lcBdImportOpen=false;lcBdMsg='';lcBdRefresh();}
function lcBdTplPanel(){const t=lcBdTpl();return `<div class="lc-bd-tpl">

  <label class="lc-bd-lbl" style="margin:0">模板名字</label><input class="lc-bd-input" id="lcBdTplName" value="${h(t.name)}" aria-label="模板名字" style="max-width:320px">

  <button class="lc-bd-btn" onclick="lcBdResetTpl()">恢复默认</button>

  <label class="lc-bd-lbl">正文（可用变量：{first} 名字、{handle} 账号、{followers} 粉丝、{video} 最近作品、{opener} 自动个性化开场句）</label>

function lcBdSetAutoLang(on){lcBdState.autoLang=!!on;lcBdSave();lcBdMsg=on?'已开启：意大利达人用意大利语、巴西用葡语、其余用英文':'已关闭：统一用当前选中的模板';lcBdRefresh();}
function lcBdPickTpl(id){lcBdState.templateId=id;lcBdSave();lcBdRefresh();}
function lcBdSaveTpl(){const t=lcBdTpl();const n=document.getElementById('lcBdTplName'),sub=document.getElementById('lcBdTplSubject'),body=document.getElementById('lcBdTplBody');

  t.name=n.value.trim()||t.name;t.subject=sub.value;t.body=body.value;lcBdSave();lcBdMsg='模板已保存，之后生成的邮件都用这版';lcBdRefresh();}
function lcBdNewTpl(){const t=lcBdTpl();const nt={id:'tpl'+Date.now().toString(36),name:(t.name||'模板')+' 副本',subject:t.subject,body:t.body};lcBdState.templates.push(nt);lcBdState.templateId=nt.id;lcBdSave();lcBdMsg='已另存为新模板';lcBdRefresh();}
function lcBdResetTpl(){const t=lcBdTpl();t.subject=LC_BD_DEFAULT_TPL.subject;t.body=LC_BD_DEFAULT_TPL.body;lcBdSave();lcBdMsg='已恢复默认内容';lcBdRefresh();}
function lcBdDelTpl(){if(lcBdState.templates.length<2){lcBdMsg='至少保留一个模板';lcBdRefresh();return;}if(!confirm('删掉这个模板？'))return;lcBdState.templates=lcBdState.templates.filter(x=>x.id!==lcBdState.templateId);lcBdState.templateId=lcBdState.templates[0].id;lcBdSave();lcBdRefresh();}
function lcBdSwitch(b){lcBdState.batch=b;lcBdFilter='all';lcBdSave();lcBdRefresh();}
function lcBdFilterSet(k){lcBdFilter=k;lcBdRefresh();}
function lcBdToggleImport(){lcBdImportOpen=!lcBdImportOpen;lcBdMsg='';lcBdRefresh();}
/* ===== 自动发信：助手连接 ===== */
const LC_BD_HELPER='http://127.0.0.1:8771';
let lcBdHelper={online:false,configured:false,mailboxes:[],schedule:null},lcBdQueue={pending:0,hourCount:0,perHour:0,nextDue:0,recent:[]},lcBdSetOpen=false,lcBdBusy='',lcBdMs={code:'',uri:'',polling:false};
function lcBdApi(path,body){return fetch(LC_BD_HELPER+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(r=>r.json()).catch(()=>null);}
function lcBdHomeToday(){const el=document.getElementById('lcBdHomeToday');if(!el)return;const q=lcBdQueue||{},t=q.today;
  el.innerText=t&&t.sent!==undefined?(' · 今日已发 '+t.sent+' 封'+(q.pending?(' · 队列里还有 '+q.pending+' 封'):'')):'';}
function lcBdSync(){lcBdApi('/health').then(h=>{if(!h)return lcBdHelper.online=false,lcBdRefresh();lcBdHelper={online:true,configured:!!h.configured,mailboxes:h.mailboxes||[],schedule:h.schedule||null};
  return lcBdApi('/queue/status').then(q=>{if(q&&q.ok){lcBdQueue=q;lcBdApplySent(q.recent||[]);}lcBdRefresh();lcBdHomeToday();});});}
function lcBdApplySent(recent){if(!recent||!recent.length)return;let changed=false;
  recent.forEach(r=>{if(r.state&&r.state!=='sent')return;const l=lcBdState.leads.find(x=>x.email===r.to);if(l&&l.status==='new'){l.status='sent';l.sentAt=(r.at||'').slice(0,10);changed=true;}});
  if(changed){lcBdSave();}}
function lcBdSendOne(id){const l=lcBdState.leads.find(x=>x.id===id);if(!l)return;if(lcBdIsBlocked(l.email)){lcBdMsg=l.email+' 在黑名单里，发不了';lcBdRefresh();return;}
  if(['replied','negotiating','sampled','won'].includes(l.status)){if(!confirm(l.email+' 已经是「'+lcBdLabel(l.status)+'」了，还要再发一封吗？'))return;}
  const m=lcBdMail(l);
  lcBdBusy=id;lcBdRefresh();
  lcBdApi('/queue/add',{items:[{to:l.email,subject:m.subject,body:m.body}]}).then(r=>{lcBdBusy='';lcBdMsg=r&&r.ok?('已加入发送队列：'+l.email):((r&&r.error)||'发信助手没开');lcBdSync();});}
function lcBdQueueAll(){const leads=lcBdState.leads.filter(l=>l.batch===lcBdState.batch&&l.status==='new'&&!lcBdIsBlocked(l.email)&&(!lcBdFilter||lcBdFilter==='all'||l.status===lcBdFilter));
  if(!leads.length){lcBdMsg='当前筛选里没有“未联系”的人';lcBdRefresh();return;}
  if(!confirm('把 '+leads.length+' 个人加入发送队列？助手会按排期一封一封发。'))return;
  const items=leads.map(l=>{const m=lcBdMail(l);return {to:l.email,subject:m.subject,body:m.body};});
  lcBdApi('/queue/add',{items}).then(r=>{lcBdMsg=r&&r.ok?('已排队 '+r.added+' 人'+(r.skipped?('，跳过 '+r.skipped+' 人（已发过或重复）'):'')+'，待发 '+r.pending+' 封'):((r&&r.error)||'发信助手没开');lcBdSync();});}
function lcBdSetToggle(){lcBdSetOpen=!lcBdSetOpen;lcBdTplOpen=false;lcBdImportOpen=false;lcBdMsg='';if(lcBdSetOpen)lcBdSync();else lcBdRefresh();}
function lcBdSaveSched(){const g=id=>Number((document.getElementById(id)||{}).value||0);
  const body={per_hour:g('lcBdPerHour'),window_start:g('lcBdWinStart'),window_end:g('lcBdWinEnd'),gap_min:g('lcBdGapMin'),gap_max:g('lcBdGapMax')};
  lcBdApi('/queue/config',body).then(()=>{lcBdMsg='排期已保存';lcBdSync();});}
function lcBdAddGmail(){const user=(document.getElementById('lcBdGUser')||{}).value||'';const pw=(document.getElementById('lcBdGPwd')||{}).value||'';
  if(!user||!pw){lcBdMsg='邮箱和应用专用密码都要填';lcBdRefresh();return;}
  lcBdApi('/mailboxes/add',{user,pw,password:pw,provider:'gmail'}).then(r=>{lcBdMsg=r&&r.ok?'Gmail 已添加':((r&&r.error)||'添加失败');lcBdSync();});}
function lcBdTestMb(user,provider){lcBdBusy='test:'+user;lcBdRefresh();
  lcBdApi('/mailboxes/test',{user,provider:provider||''}).then(r=>{lcBdBusy='';lcBdMsg=(user+'：')+((r&&r.msg)||'没响应');lcBdRefresh();});}
function lcBdMsStart(){const cid=((document.getElementById('lcBdMsClient')||{}).value||'').trim();lcBdMs.client=cid;
  if(!cid){lcBdMsg='先把微软应用编号粘贴到框里';lcBdRefresh();return;}
  lcBdBusy='ms';lcBdRefresh();
  lcBdApi('/ms/start',{client_id:cid}).then(r=>{lcBdBusy='';
    if(r&&r.ok){lcBdMs={code:r.user_code,uri:r.verify_uri,device:r.device_code,interval:r.interval||5,polling:true};lcBdMsg='';lcBdMsPoll();}
    else lcBdMsg=(r&&r.error)||'需要先填微软应用编号';
    lcBdRefresh();});}
function lcBdMsPoll(){if(!lcBdMs.polling)return;
  lcBdApi('/ms/poll',{device_code:lcBdMs.device,client_id:lcBdMs.client||''}).then(r=>{
    if(r&&r.ok){lcBdMs.polling=false;lcBdMsg='微软账号已授权';lcBdSync();return;}
    if(r&&r.pending){setTimeout(lcBdMsPoll,(lcBdMs.interval||5)*1000);return;}
    lcBdMs.polling=false;lcBdMsg=(r&&r.error)||'授权没完成';lcBdRefresh();});}
function lcBdSetPanel(){const st=lcBdHelper,s=st.schedule||{per_hour:5,window_start:9,window_end:20,gap_min:90,gap_max:240};
  const mbList=(st.mailboxes||[]).map(m=>`<div class="lc-bd-mb"><span>${h(m.user)}</span><span class="lc-bd-badge muted">${m.provider==='gmail'?'Gmail':m.provider==='outlook-graph'?'微软授权':'Outlook'}</span><button class="lc-bd-btn" onclick="lcBdTestMb('${h(m.user)}','${h(m.provider||'')}')">测连接</button></div>`).join('')||'<div class="lc-empty">还没有发信邮箱</div>';
  return `<div class="lc-bd-tpl">
    <div class="lc-bd-tools"><b>发信助手</b><span class="lc-bd-badge ${h.online?'ok':'bad'}">${st.online?'在线':'没启动'}</span><button class="lc-bd-btn" onclick="lcBdSync()">刷新</button><button class="lc-bd-btn" onclick="lcBdSetToggle()">收起</button></div>
    <label class="lc-bd-lbl">已添加的发信邮箱</label>${mbList}
    <label class="lc-bd-lbl">添加 Outlook 邮箱（微软已停用密码发信，需授权一次）</label>
    <div class="lc-bd-tools"><input class="lc-bd-input" id="lcBdMsClient" placeholder="微软应用编号（粘贴到这里）" style="max-width:330px" value="${h(lcBdMs.client||'')}"><button class="lc-bd-btn primary" onclick="lcBdMsStart()">授权微软账号</button></div>
    ${lcBdMs.code?`<div class="lc-bd-msg">① 打开 ${lcBdMs.uri} ② 输入代码 <b>${lcBdMs.code}</b> ③ 登录并允许 ④ 回来等提示</div>`:''}
    <label class="lc-bd-lbl">添加 Gmail（需要应用专用密码）</label>
    <div class="lc-bd-tools"><input class="lc-bd-input" id="lcBdGUser" placeholder="you@gmail.com" style="max-width:260px"><input class="lc-bd-input" id="lcBdGPwd" type="password" placeholder="16 位应用专用密码" style="max-width:220px"><button class="lc-bd-btn" onclick="lcBdAddGmail()">添加</button></div>
    <label class="lc-bd-lbl">发送节奏：每小时 <input class="lc-bd-input" id="lcBdPerHour" type="number" value="${s.per_hour}" style="width:80px;display:inline-block"> 封，只在 <input class="lc-bd-input" id="lcBdWinStart" type="number" value="${s.window_start}" style="width:70px;display:inline-block"> 点到 <input class="lc-bd-input" id="lcBdWinEnd" type="number" value="${s.window_end}" style="width:70px;display:inline-block"> 点之间，两封间隔 <input class="lc-bd-input" id="lcBdGapMin" type="number" value="${s.gap_min}" style="width:80px;display:inline-block"> ~ <input class="lc-bd-input" id="lcBdGapMax" type="number" value="${s.gap_max}" style="width:80px;display:inline-block"> 秒</label>
    <div class="lc-bd-tools"><button class="lc-bd-btn primary" onclick="lcBdSaveSched()">保存节奏</button></div>
  </div>`;}
function lcBdQueueLine(){const q=lcBdQueue||{};if(!lcBdHelper.online)return `<span class="lc-bd-badge bad">发信助手没启动</span>`;if(q.paused)return `<span class="lc-bd-badge warn">已暂停</span><span class="lc-bd-badge muted">待发 ${q.pending||0} 封</span>`;
  return `<span class="lc-bd-badge ${q.pending?'info':'muted'}">待发 ${q.pending||0} 封</span><span class="lc-bd-badge muted">本小时 ${q.hourCount||0}/${q.perHour||0}</span>${q.pending?`<span class="lc-bd-badge muted">下一封约 ${q.nextDue||0} 秒后</span>`:''}`;}

/* ===== 发送队列面板 ===== */
let lcBdQueueOpen=false;
function lcBdQueueToggle(){lcBdQueueOpen=!lcBdQueueOpen;lcBdSetOpen=false;lcBdTplOpen=false;lcBdImportOpen=false;lcBdMsg='';if(lcBdQueueOpen)lcBdSync();else lcBdRefresh();}
function lcBdPause(on){lcBdApi('/queue/pause',{paused:!!on}).then(()=>{lcBdMsg=on?'已暂停，队列里的人不会发出去':'已继续发送';lcBdSync();});}
function lcBdRemoveQueued(to){lcBdApi('/queue/remove',{to}).then(r=>{lcBdMsg=r&&r.ok?('已撤回 '+to):'撤回失败';lcBdSync();});}
function lcBdClearQueue(){if(!confirm('清空队列？里面还没发的人不会发出去。'))return;lcBdApi('/queue/clear',{}).then(()=>{lcBdMsg='队列已清空';lcBdSync();});}
function lcBdRetry(to){const lead=lcBdState.leads.find(x=>x.email===to);const items=lead?[{to:lead.email,subject:lcBdMail(lead).subject,body:lcBdMail(lead).body}]:[{to,subject:'（补发）',body:''}];
  lcBdApi('/queue/add',{items,force:true}).then(r=>{lcBdMsg=r&&r.ok?('已重新排队：'+to):'重排失败';lcBdSync();});}
function lcBdQueuePanel(){const q=lcBdQueue||{};const items=q.queue||[];const rec=(q.recent||[]).filter(r=>r.state!=='sent').slice(-5);
  const t=q.today||{sent:0,failed:0};
  return `<div class="lc-bd-tpl">
    <div class="lc-bd-tools"><b>发送队列</b><span class="lc-bd-badge ${q.paused?'warn':'ok'}">${q.paused?'已暂停':'进行中'}</span>
      <span class="lc-bd-badge muted">今日已发 ${t.sent} 封</span>${t.failed?`<span class="lc-bd-badge bad">失败 ${t.failed}</span>`:''}
      ${q.paused?`<button class="lc-bd-btn primary" onclick="lcBdPause(false)">继续发送</button>`:`<button class="lc-bd-btn" onclick="lcBdPause(true)">暂停全部</button>`}
      ${items.length?`<button class="lc-bd-btn" onclick="lcBdClearQueue()">清空队列</button>`:''}
      <button class="lc-bd-btn" onclick="lcBdSync()">刷新</button><button class="lc-bd-btn" onclick="lcBdQueueToggle()">收起</button></div>
    ${items.length?`<label class="lc-bd-lbl">排在最前面的 ${items.length} 个人</label>${items.slice(0,10).map((it,i)=>`<div class="lc-bd-mb"><span>${i+1}. ${h(it.to)}</span><span class="lc-bd-muted">${h(it.subject||'')}</span><button class="lc-bd-btn" onclick="lcBdRemoveQueued('${h(it.to)}')">撤回</button></div>`).join('')}`:'<div class="lc-empty">队列是空的，去名单里点“加入发送队列”</div>'}
    ${rec.length?`<label class="lc-bd-lbl">最近发失败的</label>${rec.map(r=>`<div class="lc-bd-mb"><span>${h(r.to)}</span><span class="lc-bd-badge bad">${h((r.error||'失败').slice(0,40))}</span><button class="lc-bd-btn" onclick="lcBdRetry('${h(r.to)}')">再发一次</button></div>`).join('')}`:''}
    <div class="lc-bd-muted" style="font-size:12px">发送规则：${q.perHour||0} 封/小时，${(q.window||[9,20])[0]}–${(q.window||[9,20])[1]} 点之间，两封之间会随机等一会，像真人。</div>
  </div>`;}

function lcBdSeed(){try{let seed=null;const q=(location.hash.split('?')[1]||'');seed=new URLSearchParams(q).get('seed');
  if(!seed&&location.protocol==='file:'&&!lcBdState.leads.length)seed='demo.mail1@example.com,demo.mail2@example.com,demo.mail3@example.com';
  if(!seed)return;const list=lcBdParse(decodeURIComponent(seed).replace(/,/g,'\n'));if(!list.length)return;if(list.some(x=>lcBdState.leads.some(l=>l.email===x.email)))return;lcBdAdd(list);lcBdMsg='已载入 '+list.length+' 个测试邮箱';try{history.replaceState(null,'','#/outreach');}catch(e){}}catch(e){}}
function lcOutreachPage(){lcBdSeed();setTimeout(()=>{try{lcBdSync();}catch(e){}},80);const leads=lcBdState.leads.filter(l=>l.batch===lcBdState.batch);const c=lcBdCounts(leads);
  return lcShell('outreach',`<section class="lc-panel lc-ops" id="lcBdOps"><div class="lc-business-head"><h2>邮件建联 ${lcHelp('这里管的是“已经拿到邮箱、准备发信”的人。导入邮箱会自动补账号、粉丝和最近作品；状态由 BD 手动切换，工作台不自动追踪邮件。发出 3 天没回复会提示跟进，7 天提示换话术。')}</h2><div class="lc-bd-headline" id="lcBdHead">${lcBdHeadHTML()}</div></div><div id="lcBdRoot">${lcBdBodyHTML()}</div></section>`);}
function lcHomeOutreach(){const leads=lcBdState.leads;const c=lcBdCounts(leads);const order={bad:0,warn:1,info:2,muted:3,ok:4};

function lcAuditCaptureRows(){const rows={},labels=Object.fromEntries(lcBaseColumns('all').map(([key,name])=>[key,lcHeaderName(key,name)])),present=new Set(DATA.creators.map(c=>c.id)),people=new Map([...lcDeletedPool,...DATA.creators.map(c=>[c.id,c])]);for(const [id,c] of people){const fields=Object.fromEntries(lcBuiltinColumns('all').filter(([key])=>key!=='evidence').map(([key])=>[key,lcBuiltinRawValue(c,key)]));for(const f of lcCustomFields)fields[f.id]=lcCustomValue(c,f,false)??'';fields.__present=present.has(id)?'存在':'已移出名单';rows[id]={name:c.name,fields,labels};}return rows;}

const LC_HISTORY_KEY='creatorwb_table_history_v1';
let lcHistory={entries:[],cursor:0},lcHistoryDepth=0;
const lcHistoryKeys=[LC_KEY,LC_LOCAL_KEY,LC_DELETED_KEY,LC_CUSTOM_KEY,LC_HEADERS_KEY,LC_WIDTHS_KEY,LC_LAYOUT_KEY,LC_DRAFT_KEY];
try{const v=JSON.parse(lcStore.getItem(LC_HISTORY_KEY)||'null');if(v&&Array.isArray(v.entries)&&Number.isInteger(v.cursor)&&v.cursor>=0&&v.cursor<=v.entries.length)lcHistory=v;}catch(e){}
function lcMigrateAuditFromUndo(){if(lcStore.getItem(LC_AUDIT_KEY)!==null||!lcHistory.entries.length)return;const read=value=>{try{return JSON.parse(value||'{}')||{};}catch(e){return {};}},converted=lcHistory.entries.map(entry=>{const people=new Map(),put=(id,key,a,b)=>{if(JSON.stringify(a)===JSON.stringify(b))return;let row=people.get(id);if(!row){row={id,name:lcDeletedPool.get(id)?.name||entry.profiles?.[id]?.[1]?.name||entry.profiles?.[id]?.[0]?.name||id,changes:[]};people.set(id,row);}if(!row.changes.some(c=>c.key===key))row.changes.push({key,field:lcAuditLabel(key),before:a,after:b});};for(const [id,pair]of Object.entries(entry.profiles||{}))for(const key of LC_PROFILE)put(id,key,pair[0]?.[key],pair[1]?.[key]);const pair=entry.storage?.[LC_KEY];if(pair){const a=read(pair[0]),b=read(pair[1]);for(const id of new Set([...Object.keys(a),...Object.keys(b)])){for(const key of new Set([...Object.keys(a[id]||{}),...Object.keys(b[id]||{})]))if(key!=='profile'&&key!=='custom')put(id,key,a[id]?.[key],b[id]?.[key]);for(const key of new Set([...Object.keys(a[id]?.custom||{}),...Object.keys(b[id]?.custom||{})]))put(id,key,a[id]?.custom?.[key],b[id]?.custom?.[key]);}}const deleted=entry.storage?.[LC_DELETED_KEY];if(deleted){const a=read(deleted[0]),b=read(deleted[1]);for(const id of new Set([...Object.keys(a),...Object.keys(b)]))put(id,'__present',a[id]?'已移出名单':'存在',b[id]?'已移出名单':'存在');}return {time:entry.time,actor:'当前浏览器',label:entry.label,rows:[...people.values()]};});lcAudit=converted;for(let i=converted.length-1;i>=lcHistory.cursor;i--){const entry=converted[i];lcAudit.push({...entry,label:'已撤销：'+entry.label,rows:entry.rows.map(row=>({...row,changes:row.changes.map(c=>({...c,before:c.after,after:c.before}))}))});}try{lcStore.setItem(LC_AUDIT_KEY,JSON.stringify(lcAudit));}catch(e){}}

function lcHistoryStep(direction){const index=direction<0?lcHistory.cursor-1:lcHistory.cursor,e=lcHistory.entries[index];if(!e)return;const auditBefore=lcAuditCaptureRows();const side=direction<0?0:1,before=Object.fromEntries(Object.keys(e.storage).map(k=>[k,lcStore.getItem(k)]));try{for(const [key,values] of Object.entries(e.storage)){if(values[side]===null)lcStore.removeItem(key);else lcStore.setItem(key,values[side]);}}catch(error){for(const [key,v] of Object.entries(before))try{if(v===null)lcStore.removeItem(key);else lcStore.setItem(key,v);}catch(_){}lcInlineNotice='撤销／重做失败，未更改当前资料';lcShowInlineNotice();return;}

var themeOverride=null;
function prefersDark(){
  try{return window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}
}
function isDarkNow(){
  return themeOverride ? (themeOverride==='dark') : prefersDark();
}
function applyTheme(){
  var dark=isDarkNow();
  document.body.classList.toggle('dark', dark);
  var b=document.getElementById('themeBtn');
  if(b) b.textContent = dark ? '☀️ 白天' : '🌙 黑夜';
  try{
    var fr=document.getElementById('boardFrame');
    if(fr && fr.contentWindow) fr.contentWindow.postMessage({theme: dark?'dark':'light'},'*');
  }catch(e){}
}
function postThemeToBoard(el){
  try{ if(el && el.contentWindow) el.contentWindow.postMessage({theme: isDarkNow()?'dark':'light'},'*'); }catch(e){}
}
function toggleLightDark(){
  themeOverride = isDarkNow() ? 'light' : 'dark';
  applyTheme();
}
(function(){
  applyTheme();
  try{
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    var cb=function(){ if(!themeOverride) applyTheme(); };
    if(mq.addEventListener) mq.addEventListener('change',cb);
    else if(mq.addListener) mq.addListener(cb);
  }catch(e){}
})();
